<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <!-- Referencia estándar de CSS y sintaxis Thymeleaf -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <header class="header">
            <h1>Usuarios</h1>
            <p class="subtitle">Sistem de gestión</p>
        </header>

        <!-- Contenido principal -->
        <main class="content-card">
            <div class="toolbar">
                <h2>Usuarios Registrados</h2>
                <!-- Referencia Thymeleaf: th:href="@{/usuarios/nuevo}" -->
                <a href="#" th:href="@{/usuarios/nuevo}" class="btn btn-primary">
                    <svg class="icon" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Nuevo Usuario
                </a>
            </div>

            <!-- Tabla de datos -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>COD</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Contraseña</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody th:if="${!usuarios.isEmpty()}">
                        <!-- 
                            REFERENCIA THYMELEAF: 
                            Usa th:each en la fila tr para iterar la lista enviada desde el Controller:
                            <tr th:each="usuario : ${usuarios}">
                        -->
                        <tr th:each="usuario: ${usuarios}">
                            <!-- Thymeleaf: th:text="${usuario.cod}" -->
                            <td th:text="${usuario.codUser}" ></td>
                            <!-- Thymeleaf: th:text="${usuario.nombre}" -->
                            <td th:text="${usuario.username}"></td>
                            <!-- Thymeleaf: th:text="${usuario.correo}" -->
                            <td th:text="${usuario.email}"></td>
                            <td th:text="${usuario.password}"><span class="password-mask"></span></td>
                            <!-- Thymeleaf: th:text="${usuario.rol}" -->
                            <td th:text="${usuario.rol}"><span class="badge-role"></span></td>
                            <td class="actions-cell">
                                <!-- Botón Editar -->
                                <!-- Thymeleaf: th:href="@{/usuarios/editar/{id}(id=${usuario.cod})}" -->
                                <a href="#" th:href="@{/usuarios/editar/{codUser}(codUser=${usuario.codUser})}" class="btn-icon btn-edit" title="Editar usuario">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </a>
                                <!-- Botón Eliminar -->
                                <!-- Thymeleaf: th:href="@{/usuarios/eliminar/{id}(id=${usuario.cod})}" -->
                                <form action="#" th:action="@{/usuarios/eliminar/{codUser}(codUser=${usuario.codUser})}" class="btn-icon btn-delete" method="post"
                                onsubmit="return confirm('¿Deseas Eliminar Este Usuario?')"
                                >
                                <button type="submit" title="Eliminar usuario">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                                </form>
                            </td>
                        </tr>

                        <!-- Fila estática de ejemplo 2 -->
                        <tr>
                            <td>102</td>
                            <td>Carlos López</td>
                            <td>carlos.lopez@example.com</td>
                            <td><span class="password-mask">••••••••</span></td>
                            <td><span class="badge-role">Usuario</span></td>
                            <td class="actions-cell">
                                <a href="#" class="btn-icon btn-edit" title="Editar usuario">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </a>
                                <a href="#" class="btn-icon btn-delete" title="Eliminar usuario">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

</body>
</html>
