<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
    <!-- Referencia de CSS puro para Spring Boot / Thymeleaf -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="container-narrow">

        <!-- Botón Volver en la parte superior -->
        <nav class="nav-back">
            <!-- Referencia Thymeleaf para regresar al listado: th:href="@{/usuarios}" -->
            <a href="lista.html" th:href="@{/usuarios}" class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver
            </a>
        </nav>

        <!-- Encabezado -->
        <header class="header">
            <h1>Usuarios</h1>
            <p class="subtitle">Sistema de gestión</p>
        </header>

        <!-- Tarjeta del Formulario -->
        <main class="content-card">
            <h2 class="card-title" th:text="${titulo}">Nuevo Usuario</h2>

            <!-- 
                REFERENCIA THYMELEAF FORMULARIO:
                Usa th:action para definir la URL de guardado y th:object para binding del DTO/Entidad:
                th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post"

            -->
            <div class="error-message" th:if="${error!=null}" th:text="${error}"></div>
            <form action="#" th:action="@{/usuarios/crear}" th:object="${usuario}" method="post" class="form-grid">

                <input
                        type="hidden"
                        id="codUser"
                        name="codUser"
                        th:field="*{codUser}"
                >

                <!-- Campo: Nombre Usuario -->
                <div class="form-group">
                    <label for="username">Nombre usuario</label>
                    <!-- Referencia Thymeleaf: th:field="*{username}" -->
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        th:field="*{username}" 
                        class="form-control" 
                        placeholder="Ej. jgarcia" 
                        required>
                </div>

                <!-- Campo: Correo -->
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <!-- Referencia Thymeleaf: th:field="*{email}" -->
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        th:field="*{email}" 
                        class="form-control" 
                        placeholder="ejemplo@correo.com" 
                        required>
                </div>

                <!-- Campo: Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <!-- Referencia Thymeleaf: th:field="*{password}" -->
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        th:field="*{password}" 
                        class="form-control"
                        required>
                </div>

                <!-- Campo: Rol -->
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <!-- Referencia Thymeleaf: th:field="*{rol}" -->
                    <select id="rol" name="rol" th:field="*{rol}" class="form-control" required>
                        <option value="" disabled selected>Seleccione un rol</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                        <option value="USUARIO">Usuario</option>
                        <option value="SUPERVISOR">Supervisor</option>
                    </select>
                </div>

                <!-- Acciones del Formulario -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Guardar
                    </button>
                </div>

            </form>
        </main>
    </div>

</body>
</html>
